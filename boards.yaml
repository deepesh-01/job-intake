  # ── Hirist.tech — premium India tech (auth required) ──
  # gladiator.hirist.tech LoopBack API behind JWT cookies; no okhttp UA bypass.
  # Returns the user's personalized feed (server-side ranked to profile);
  # filter params (kw/loc/exp) are silently ignored — only `pages=N` matters.
  # Requires HIRIST_COOKIES env var. JWT expires ~30 days; refresh by re-login.
  # See src/scout/sources/hirist.py docstring for setup.
  - { slug: hirist_feed,               source_type: hirist,    board_id: "pages=3",                                                     enabled: true  }

