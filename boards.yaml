  # ── LinkedIn — unauthenticated guest endpoint (added 2026-04-27) ──
  # board_id format: kw=...;loc=...;tpr=...;wt=...;exp=...;details=true
  # tpr: r604800=past week, r86400=past 24h. wt: 2=remote. exp: 4=mid-senior, 5=director.
  # Cap is 25 postings per board; ~50 LinkedIn reqs total before 429 risk.
  # Starter set covers your senior IC + India + AI focus.
  - { slug: li_blr_senior_backend, source_type: linkedin, board_id: "kw=senior backend engineer;loc=Bengaluru;tpr=r604800;exp=4,5",   enabled: true }
  - { slug: li_blr_staff_swe,      source_type: linkedin, board_id: "kw=staff software engineer;loc=Bengaluru;tpr=r604800;exp=4,5",  enabled: true }
  - { slug: li_blr_full_stack,     source_type: linkedin, board_id: "kw=senior full stack engineer;loc=Bengaluru;tpr=r604800;exp=4,5", enabled: true }
  - { slug: li_india_remote_ai,    source_type: linkedin, board_id: "kw=ai engineer;loc=India;tpr=r604800;wt=2;exp=4,5",             enabled: true }
  - { slug: li_india_founding_eng, source_type: linkedin, board_id: "kw=founding engineer;loc=India;tpr=r604800;exp=4,5",            enabled: true }

  # ── LinkedIn (authenticated) — uses your `li_at` session cookie ──
  # Added 2026-04-29 per India-pivot. Higher rate-limit budget unlocks deeper
  # India coverage (companies that post on LinkedIn but don't use a public ATS).
  # Kept DISABLED by default until LI_AT_COOKIE is set. Setup:
  #   1. Log in to linkedin.com in your browser.
  #   2. Devtools → Application → Cookies → linkedin.com → copy `li_at` value.
  #   3. Add to launchd plist env or ~/.zshrc:  export LI_AT_COOKIE='AQEDA...'
  #   4. Flip enabled: true below and run scripts/verify_boards.py to confirm.
  # board_id supports `pages=N` for pagination (default 1, max 5).
  # Refresh the cookie every ~365 days.
  # Controlled first-rollout (2026-04-29): 4 boards enabled with details=false
  # to keep the first daily run conservative on the auth rate budget. Verified
  # smoke test returned 10 India-located postings (Google/Razorpay/Uber/Walmart
  # Global Tech India/Roku) from a single 2-page query. Flip the rest to true
  # once the auth budget proves stable across a few runs.
  - { slug: li_auth_blr_senior_backend, source_type: linkedin_auth, board_id: "kw=senior backend engineer;loc=Bengaluru;tpr=r604800;exp=4,5;pages=2;details=false",      enabled: true }
  - { slug: li_auth_blr_staff_swe,      source_type: linkedin_auth, board_id: "kw=staff software engineer;loc=Bengaluru;tpr=r604800;exp=4,5;pages=2;details=false",     enabled: true }
  - { slug: li_auth_india_remote_senior,source_type: linkedin_auth, board_id: "kw=senior software engineer;loc=India;tpr=r604800;wt=2;exp=4,5;pages=2;details=false",   enabled: true }
  - { slug: li_auth_india_founding_eng, source_type: linkedin_auth, board_id: "kw=founding engineer;loc=India;tpr=r604800;exp=4,5;pages=2;details=false",                enabled: true }
  - { slug: li_auth_blr_full_stack,     source_type: linkedin_auth, board_id: "kw=senior full stack engineer;loc=Bengaluru;tpr=r604800;exp=4,5;pages=2;details=false",  enabled: true }
  - { slug: li_auth_blr_eng_manager,    source_type: linkedin_auth, board_id: "kw=engineering manager;loc=Bengaluru;tpr=r604800;exp=5,6;pages=2;details=false",          enabled: true }
  - { slug: li_auth_india_hybrid_senior,source_type: linkedin_auth, board_id: "kw=senior software engineer;loc=India;tpr=r604800;wt=3;exp=4,5;pages=2;details=false",   enabled: true }
  - { slug: li_auth_india_ml_engineer,  source_type: linkedin_auth, board_id: "kw=machine learning engineer;loc=India;tpr=r604800;exp=4,5;pages=2;details=false",        enabled: true }

