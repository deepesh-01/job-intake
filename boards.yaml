  # ── Instahyre — premium India tech aggregator ──
  # Public REST endpoint /api/v1/job_search/ via okhttp UA bypass (Cloudflare BM
  # whitelists the mobile UA on this path; browser UAs hit a JS challenge).
  # See src/scout/sources/instahyre.py docstring for the empirical findings.
  #
  # Recon 2026-04-29: unauth feed returns the global pool (~13.6k jobs) sorted
  # newest-first. Filter params (q/loc/exp) are silently ignored without auth —
  # 1 broad feed-board is the right shape until/unless cookie auth unlocks
  # server-side filtering. Filter-targeted boards below are kept disabled and
  # ready to flip on if a smoke-test confirms auth honors filters.
  - { slug: instahyre_feed,            source_type: instahyre, board_id: "pages=5",                                                     enabled: true  }
  - { slug: instahyre_blr_senior_backend, source_type: instahyre, board_id: "q=senior backend engineer;loc=bengaluru;exp=4-9;pages=3",  enabled: false }
  - { slug: instahyre_blr_staff_swe,   source_type: instahyre, board_id: "q=staff software engineer;loc=bengaluru;exp=5-12;pages=3",    enabled: false }
  - { slug: instahyre_blr_full_stack,  source_type: instahyre, board_id: "q=senior full stack engineer;loc=bengaluru;exp=4-9;pages=3",  enabled: false }
  - { slug: instahyre_blr_eng_manager, source_type: instahyre, board_id: "q=engineering manager;loc=bengaluru;exp=6-15;pages=3",        enabled: false }
  - { slug: instahyre_india_remote,    source_type: instahyre, board_id: "q=senior software engineer;loc=remote;exp=4-9;pages=3",       enabled: false }
