# Company-name patterns suggesting Indian-services-style consultancies
# even if not in the explicit excluded_companies list.

excluded_company_patterns:
  - ".*(consulting|consultancy|services|solutions) (pvt|private) ltd.*"
  - ".*(it services|it consulting|software services).*"
  # Round 5 (2026-04-29 — Hirist audit) — body-shop / staffing / HR-consultancy
  # patterns that hide the end-employer. Calibrated against observed Hirist bloat;
  # legit product cos with similar names (HealthEdge, Agoda, QuEST, Accion, Nineleaps,
  # InfoCepts, Draup) are explicitly NOT matched by these patterns.
  - "(?i).*\\bhr\\s+(consulting|solutions|consultancy)\\b.*"          # Pan Asia HR, Nexis HR
  - "(?i).*\\btalent\\s+(forge|partners|connect|search|hunt)\\b.*"   # KBD Talent Forge
  - "(?i).*\\b(staffing|placement|manpower|workforce)\\b.*"
  - "(?i).*\\bconsulting\\s+llp\\b.*"                                  # NETSYSCON CONSULTING LLP
  - "(?i).*\\bglobal consultancy\\b.*"                                 # svan global consultancy
  - "(?i).*\\bpeople\\s+(consulting|solutions)\\b.*"                  # It's All About People, Think People Solutions

